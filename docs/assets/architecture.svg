<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="930" viewBox="0 0 1360 930" role="img" aria-labelledby="restaurant-title restaurant-desc">
<title id="restaurant-title">Restaurant Platform — request and persistence architecture</title><desc id="restaurant-desc">NGINX Ingress routes API and search requests. The restaurant API uses Redis cache, Keycloak authentication and a DAO selecting PostgreSQL or MongoDB. Search fetches menu items from the API during reindexing and uses Elasticsearch. Local Kubernetes deployments can be scaled manually.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#235b8a"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
.eyebrow{font-size:17px;letter-spacing:2px;font-weight:700;fill:#64748b}
.h1{font-size:36px;font-weight:700;letter-spacing:-.6px}
.h2{font-size:28px;font-weight:700;letter-spacing:-.3px}
.h3{font-size:23px;font-weight:700}
.body{font-size:20px}
.note{font-size:18px;fill:#64748b}
.label{font-size:18px;fill:#235b8a;font-weight:700}
.line{fill:none;stroke:#235b8a;stroke-width:2.3;marker-end:url(#arrow)}
.control{fill:none;stroke:#235b8a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
.card{fill:#fff;stroke:#cbd5df;stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#fafafa"/>
<text class="eyebrow" x="60" y="35">RESTAURANT PLATFORM / LOCAL KUBERNETES</text>
<text class="h1" x="60" y="84">One API. Two storage adapters. A separate search service.</text>
<text class="body" x="60" y="119" fill="#64748b">Request routing, domain logic and infrastructure dependencies</text>
<line x1="60" y1="142" x2="1300" y2="142" stroke="#cbd5df"/>
<rect x="60" y="180" width="1240" height="94" rx="10" fill="#235b8a"/>
<text x="84" y="210" style="fill:#dfe9f1;font-size:17px;letter-spacing:2px;font-weight:700">ENTRY POINT</text>
<text x="84" y="249" style="fill:#fff;font-size:28px;font-weight:700">NGINX Ingress</text>
<text x="1276" y="240" text-anchor="end" style="fill:#fff;font-size:20px">localhost · path-based routing</text>

<path class="line" d="M450 274 V360"/><text class="label" x="466" y="323">/api</text>
<path class="line" d="M1115 274 V360"/><text class="label" x="1131" y="323">/search</text>

<rect class="card" x="60" y="360" width="780" height="240" rx="10"/>
<rect x="60" y="360" width="6" height="240" rx="3" fill="#235b8a"/>
<text class="eyebrow" x="90" y="395">APPLICATION</text>
<text class="h2" x="90" y="438">Restaurant API</text>
<text class="body" x="90" y="473">TypeScript / Express</text>
<text class="note" x="90" y="505">Restaurants · menus · reservations · orders · users</text>
<rect x="84" y="535" width="732" height="44" rx="5" fill="#edf2f6"/>
<text class="label" x="102" y="564">DAO interfaces</text>
<text class="note" x="790" y="564" text-anchor="end">DB_ENGINE selects the adapter</text>

<rect class="card" x="930" y="360" width="370" height="240" rx="10"/>
<text class="eyebrow" x="956" y="395">SEARCH</text>
<text class="h2" x="956" y="438">Search service</text>
<text class="body" x="956" y="473">TypeScript / Express</text>
<text class="note" x="956" y="516">Full-text and category queries</text>
<text class="note" x="956" y="549">Reindex endpoint</text>

<path class="line" d="M930 486 H884 V338 H800 V360"/>
<text class="note" x="865" y="312" text-anchor="middle">Reindex reads menu items</text>

<path class="line" d="M163 600 V709"/><rect x="99" y="640" width="128" height="33" fill="#fafafa"/><text class="label" x="163" y="664" text-anchor="middle">Cache-aside</text>
<path class="line" d="M410 600 V709"/><rect x="337" y="640" width="146" height="33" fill="#fafafa"/><text class="label" x="410" y="664" text-anchor="middle">Authentication</text>
<path class="line" d="M698 600 V709"/><rect x="633" y="640" width="130" height="33" fill="#fafafa"/><text class="label" x="698" y="664" text-anchor="middle">Persistence</text>
<path class="line" d="M1115 600 V709"/><rect x="1026" y="640" width="178" height="33" fill="#fafafa"/><text class="label" x="1115" y="664" text-anchor="middle">Query / bulk index</text>

<rect class="card" x="60" y="709" width="205" height="146" rx="10"/>
<text class="h3" x="84" y="750">Redis</text><text class="note" x="84" y="786">Read cache</text><text class="note" x="84" y="817">TTL + invalidation</text>
<rect class="card" x="303" y="709" width="214" height="146" rx="10"/>
<text class="h3" x="327" y="750">Keycloak</text><text class="note" x="327" y="786">JWT + role checks</text><text class="note" x="327" y="817">Own PostgreSQL DB</text>
<rect x="555" y="709" width="285" height="146" rx="10" fill="#edf2f6" stroke="#235b8a" stroke-width="1.5"/>
<text class="h3" x="579" y="750" style="font-size:20px">PostgreSQL / MongoDB</text><text class="note" x="579" y="786">One business store at a time</text><text class="note" x="579" y="817">SQL functions / Mongoose</text>
<rect class="card" x="930" y="709" width="370" height="146" rx="10"/>
<text class="h3" x="956" y="750">Elasticsearch</text><text class="note" x="956" y="786">Product index</text><text class="note" x="956" y="817">Explicit reindexing from the API</text>
<text class="note" x="60" y="901">Deployment model: local cluster · manual replica scaling · API and search health probes</text>
</svg>
